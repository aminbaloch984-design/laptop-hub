# Render Blueprint — deploys only the NEW AI proxy.
# Dashboard: New → Blueprint → connect this repository.
services:
  - type: web
    name: nabeel-ameen
    runtime: node
    plan: free
    rootDir: NEW-AI/server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: PROVIDER_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: DEFAULT_MODEL
        value: gemini-3.6-flash
      - key: FALLBACK_MODELS
        value: gemini-3.1-flash-lite,gemini-flash-lite-latest
      # Binds to all interfaces so the host can reach the process.
      - key: HOST
        value: 0.0.0.0
      # Only the published GitHub Pages site may call this proxy.
      - key: ALLOWED_ORIGIN
        value: https://aminbaloch984-design.github.io
      # Asked once in the Render dashboard; never committed.
      - key: API_KEY
        sync: false
      # Generated by Render; copy it into Settings → Access token.
      - key: AUTH_TOKEN
        generateValue: true
